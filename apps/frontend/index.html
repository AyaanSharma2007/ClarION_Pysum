<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClarION — EU CTR Regulatory Intelligence Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0a0a0a;
        --bg-card: #111111;
        --bg-hover: #1a1a1a;
        --border: #222222;
        --border-hover: #333333;
        --text: #f5f5f5;
        --text-muted: #888888;
        --text-dim: #555555;
        --accent: #ffffff;
        --green: #22c55e;
        --green-dim: rgba(34,197,94,0.15);
        --red: #ef4444;
        --amber: #f59e0b;
        --blue: #3b82f6;
        --blue-dim: rgba(59,130,246,0.1);
      }
      html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      * { scrollbar-width: thin; scrollbar-color: #222 transparent; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
      button, input, textarea, select { font-family: inherit; font-size: inherit; }
      a { color: inherit; text-decoration: none; }
      code, .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
