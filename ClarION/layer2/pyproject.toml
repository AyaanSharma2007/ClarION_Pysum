[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfi-nexus-layer2"
version = "0.1.0"
description = "RFI Nexus — Layer 2: Central Repository (Postgres + pgvector + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",   # sync driver required by Alembic migrations
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "neo4j>=5.0",             # async driver for hybrid search enrichment
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio[trio]>=4",
    "aiosqlite>=0.20",
]
# Uncomment when keys are available:
# voyage = ["voyageai>=0.2"]
# claude = ["anthropic>=0.28"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
