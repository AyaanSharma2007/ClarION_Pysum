version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfi_user
      POSTGRES_PASSWORD: rfi_pass
      POSTGRES_DB: rfi_nexus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfi_user -d rfi_nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
